name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
      - 'supabase/config.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: taadbjuelxonszosfrsk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "⚠️  WARNING: SUPABASE_ACCESS_TOKEN secret is not set in GitHub!"
            echo "⚠️  Skipping Edge Functions deployment. To enable deployment, add the token in: Settings > Secrets and variables > Actions"
            echo "✅ Workflow completed (deployment skipped)"
            exit 0
          fi
          
          echo "🚀 Deploying all Edge Functions to project: $SUPABASE_PROJECT_ID"
          
          set -e  # Arrêter en cas d'erreur
          
          # Fonctions NOWPayments
          echo "📦 Deploying check-nowpayments-payment..."
          supabase functions deploy check-nowpayments-payment --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ check-nowpayments-payment deployed"
          
          echo "📦 Deploying create-nowpayments-invoice..."
          supabase functions deploy create-nowpayments-invoice --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ create-nowpayments-invoice deployed"
          
          echo "📦 Deploying nowpayments-webhook..."
          supabase functions deploy nowpayments-webhook --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ nowpayments-webhook deployed"
          
          # Fonctions Stripe
          echo "📦 Deploying create-payment..."
          supabase functions deploy create-payment --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ create-payment deployed"
          
          echo "📦 Deploying create-checkout..."
          supabase functions deploy create-checkout --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ create-checkout deployed"
          
          echo "📦 Deploying stripe-webhook..."
          supabase functions deploy stripe-webhook --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ stripe-webhook deployed"
          
          # Autres fonctions
          echo "📦 Deploying check-subscription..."
          supabase functions deploy check-subscription --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ check-subscription deployed"
          
          echo "📦 Deploying customer-portal..."
          supabase functions deploy customer-portal --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ customer-portal deployed"
          
          echo "📦 Deploying activate-subscription..."
          supabase functions deploy activate-subscription --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
          echo "✅ activate-subscription deployed"
          
          echo "🎉 All Edge Functions deployed successfully!"

